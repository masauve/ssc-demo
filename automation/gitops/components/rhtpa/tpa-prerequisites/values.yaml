# -----------------------------------------------------------------------------
# Prerequisites for Red Hat Trusted Profile Analyzer: the PostgreSQL instance
# RHTPA stores its graph in, the OIDC client secret it authenticates with, and
# (for S3 storage) the ObjectBucketClaim its documents live in.
#
# Vendored from redhat-ads-tech/ocp-app-platform-demo-helm v1.4.2
# (`trusted-profile-analyzer/charts/tpa-prerequisites`), which is what the
# reference cluster runs. RHTPA itself is NOT installed from here -- it is
# installed by components/rhtpa-operator via the RHTPA operator
# (TrustedProfileAnalyzer, rhtpa.io/v1). This chart provides the three objects
# that CR reuses: Postgres, the S3 ObjectBucketClaim and oidc-tpa-cli.
# -----------------------------------------------------------------------------

nameOverride: "tpa-postgresql"
fullnameOverride: ""

replicaCount: 1

image:
  repository: registry.redhat.io/rhel9/postgresql-16
  pullPolicy: IfNotPresent
  tag: "1"

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

podAnnotations: {}

# Raised well above the upstream 250m/1Gi. RHTPA's importers replay the whole
# CVE List, the GitHub advisory database and the Red Hat CSAF feed into this
# database; at the upstream limit the ingest saturates the CPU quota, queries
# from the server time out, and the readiness probe below starts failing --
# which restarts Postgres mid-ingest and leaves the analysis endpoints
# answering with partial data. These are the values the reference cluster
# converged on.
resources:
  limits:
    cpu: '2'
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 2Gi

# Gates the liveness and readiness probes until Postgres accepts TCP. During
# first-boot setup and crash recovery the image listens on its Unix socket only,
# so the TCP liveness check cannot pass; without this the ~35 s liveness budget
# killed the first boot between initdb and CREATE DATABASE (leaving a volume
# every later start fails on with `database "trustify" does not exist`), and
# the crash recovery that followed -- an fsync of the whole data directory, over
# 50 s on slow storage -- was killed the same way, forever.
# 10s x 30 = 5 minutes.
startupProbe:
  tcpSocket:
    port: 5432
  periodSeconds: 10
  # 30 minutes. Once the database holds real data (the importers load several
  # GB), crash recovery replays WAL and syncs the data directory before TCP
  # opens; at 5 minutes the probe killed recovery partway through, which forced
  # the next start back into recovery from scratch -- a restart loop.
  failureThreshold: 180

# Tolerant on purpose: under importer load on slow storage a 1 s TCP check can
# miss, and a liveness kill of a busy database is what starts crash recovery.
# 6 x 20 s = 2 minutes of sustained failure before restarting.
livenessProbe:
  timeoutSeconds: 5
  periodSeconds: 20
  failureThreshold: 6
  initialDelaySeconds: 5
  tcpSocket:
    port: 5432

readinessProbe:
  # 1 s (upstream) is not enough under importer load: a `SELECT 1` that is
  # merely queued behind the ingest counts as a failed probe, Postgres is
  # marked NotReady, and the server loses its database for as long as the
  # import runs.
  timeoutSeconds: 5
  initialDelaySeconds: 5
  exec:
    command:
    - "/bin/sh"
    - "-i"
    - "-c"
    - psql -h 127.0.0.1 -U $POSTGRESQL_USER -q -d $POSTGRESQL_DATABASE -c 'SELECT 1'

service:
  portName: postgresql
  port: 5432
  containerPort: 5432
  type: ClusterIP

serviceAccount:
  create: true
  annotations: {}
  name: ""

pgsql:
  user: trustify
  database: trustify
  # DO NOT commit a real password. The same value must be given to the RHTPA
  # chart as `database.password`.
  password: REPLACE_ME

persistence:
  mode: persistent
  # Sizing history: 20Gi filled completely (~17h of importer ingest, mostly
  # redhat-sboms, which is tens of GB on its own). Postgres refuses to start
  # on a full data volume, which takes down the whole RHTPA stack. 100Gi as
  # of 2026-11-13. Growing an existing volume is safe: the storage class
  # (ocs-external-storagecluster-ceph-rbd) allows volume expansion and the
  # CSI driver resizes in place on the next pod restart.
  capacity: 100Gi

storage:
  # s3 | filesystem -- must match the RHTPA chart's own `storage.type`.
  #
  # s3 creates the ObjectBucketClaim below and REQUIRES OpenShift Data
  # Foundation (the `openshift-storage.noobaa.io` provisioner). This is what
  # the reference cluster uses.
  #
  # filesystem needs no bucket at all, so this chart creates nothing and RHTPA
  # provisions its own PVC. Cheaper, but the server and importer Deployments
  # mount that one PVC simultaneously and the RHTPA chart hardcodes
  # ReadWriteOnce on it with no override -- an RWX storage class does not help,
  # the two pods simply have to co-schedule. Prefer s3.
  type: s3
  bucketName: trustify
  storageClassName: openshift-storage.noobaa.io

oidc:
  # Keycloak realm issuer, e.g.
  # https://sso.apps.<subdomain>/realms/backstage. Leave empty to derive it
  # from global.cluster.subdomain.
  issuerUrl: ""
  ssoHostPrefix: sso
  realm: backstage
  tpaCli:
    # Written to the `oidc-tpa-cli` Secret that RHTPA reads. MUST equal the
    # keycloak component's `client.tpaCli.secret` and the pipeline's
    # `tpa-secret`; a mismatch shows up only as 401s from RHTPA.
    secret: REPLACE_ME

global:
  cluster:
    # Apps subdomain of the target cluster, e.g. apps.cluster-abcde.example.com.
    subdomain: ""

argocd:
  enabled: true
  syncwave: "-1"

# Time Postgres gets to finish its shutdown checkpoint after SIGTERM. The
# Kubernetes default (30 s) is far shorter than a checkpoint on slow storage:
# the pod was SIGKILLed mid-checkpoint, leaving an unclean data directory and a
# crash recovery on every following start.
terminationGracePeriodSeconds: 300

# Extra postgresql.conf settings, mounted at /opt/app-root/src/postgresql-cfg/
# (the rhel9/postgresql image appends every *.conf there to its config).
#
# DEMO-ONLY DURABILITY TRADE-OFF. The volume sits on slow storage (an
# HDD-backed LVMS volume group on the reference SNO), and every commit waiting
# on fsync made RHTPA's importers and API crawl. The first three settings stop
# Postgres waiting on the disk: committed data reaches it within seconds
# instead of synchronously. A clean restart loses nothing. A hard crash
# (kernel panic, power loss, SIGKILL mid-write) can corrupt the database; the
# recovery is then to wipe /var/lib/pgsql/data/userdata and let RHTPA
# re-create and re-import. Never use these settings for data you need.
#
# Chosen over an emptyDir: RHTPA only creates its schema in Helm
# pre-install/pre-upgrade hooks (create-db, migrate), so a database that comes
# back empty after every restart leaves RHTPA broken until the operator is
# forced to re-run them.
postgresqlConfig:
  fsync: "off"
  synchronous_commit: "off"
  full_page_writes: "off"
  # Crash recovery syncs the data directory before replaying WAL. `fsync` (the
  # default) opens and fsyncs every file -- 200+ s for ~8 GB here; `syncfs`
  # (PostgreSQL 14+, Linux 5.8+) does one syncfs() of the filesystem instead.
  recovery_init_sync_method: syncfs
