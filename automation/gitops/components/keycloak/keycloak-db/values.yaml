nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: registry.redhat.io/rhel8/postgresql-12
  pullPolicy: IfNotPresent
  tag: "1"

podSecurityContext: 
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

podAnnotations: {}

# The image's first boot (initdb, then a socket-only server to create the role
# and database) is CPU-bound; at the old 250m limit it overran the liveness
# probe and was killed between initdb and CREATE ROLE, leaving a data directory
# every later start fails on (`role "keycloak" does not exist`).
resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Gates the liveness and readiness probes until Postgres accepts TCP. During
# first-boot setup and crash recovery the image listens on its Unix socket
# only, so the TCP liveness check cannot pass -- without this, a slow first
# boot is killed mid-init and the volume is left half-initialized.
# 10s x 30 = 5 minutes.
startupProbe:
  tcpSocket:
    port: 5432
  periodSeconds: 10
  failureThreshold: 30

livenessProbe:
  timeoutSeconds: 1
  initialDelaySeconds: 5
  tcpSocket:
    port: 5432

readinessProbe:
  timeoutSeconds: 1
  initialDelaySeconds: 5
  exec:
    command:
    - "/bin/sh"
    - "-i"
    - "-c"
    - psql -h 127.0.0.1 -U $POSTGRESQL_USER -q -d $POSTGRESQL_DATABASE -c 'SELECT 1'

service:
  portName: postgresql
  port: 5432
  containerPort: 5432

serviceAccount:
  create: true
  annotations: {}
  name: ""

pgsql:
  user: keycloak
  password: keycloak
  database: keycloak

persistence:
  mode: persistent
  capacity: 5Gi

argocd:
  enabled: true
  syncwave: "-3"
