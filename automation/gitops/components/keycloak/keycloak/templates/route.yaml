{{- if .Values.route.enabled -}}
kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: {{ include "keycloak.name" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}    
  annotations:
    {{- include "keycloak.argocd-syncwave" . | nindent 4 }}
spec:
  # Always set, from the same helper the Keycloak CR's `hostname` uses. Setting
  # it only when route.host was given let the router assign its generated
  # `keycloak-keycloak.<domain>` whenever the default route.localName (`sso`)
  # was in effect -- so the CR advertised https://sso.<domain> as the issuer
  # while nothing served that host, and every OIDC consumer (the
  # rhtpa-prerequisites wait-for-keycloak hook first) waited on it forever.
  host: {{ include "keycloak.hostname" . }}
  to:
    kind: Service
    name: {{ include "keycloak.name" . }}-service
    weight: 100
  port:
    targetPort: {{ .Values.service.port }}
  {{- if .Values.route.tlsEnabled }}
  tls:
    {{- toYaml .Values.route.tls | nindent 4 }}
  {{- end }}
  wildcardPolicy: None
{{- end}}
