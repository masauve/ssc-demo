kind: Keycloak
apiVersion: k8s.keycloak.org/v2alpha1
metadata:
  name: {{ include "keycloak.name" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
    app: {{ include "keycloak.name" . }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    {{- include "keycloak.argocd-syncwave" . | nindent 4 }}
spec:
  db:
    vendor: {{ .Values.database.vendor }}
    host: {{ .Values.database.host }}
    usernameSecret:
      name: {{ .Values.database.secret }}
      key: database-user
    passwordSecret:
      name: {{ .Values.database.secret }}
      key: database-password
  instances: 1
  ingress: 
    enabled: {{ .Values.ingress.enabled }}
  http:
    httpEnabled: true
  # RHBK 26 hostname v2. `hostname` is a full URL, not a bare host: the Route
  # terminates TLS at the edge and forwards plain HTTP, so a bare host would let
  # Keycloak derive the scheme from the request and publish an http:// issuer
  # -- which RHTAS, RHTPA and the pipeline's `oidc-issuer` all reject, since
  # they are configured with https://sso.<domain>/realms/<realm>. The v1
  # `adminUrl` option no longer exists; `admin` is its v2 replacement.
  hostname:
    hostname: https://{{ include "keycloak.hostname" . }}
    admin: https://{{ include "keycloak.hostname" . }}
    strict: false
  # Trust X-Forwarded-* from the OpenShift router (the v2 replacement for
  # `proxy=edge`), so request-derived URLs such as backchannel ones are https.
  proxy:
    headers: xforwarded
